version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fulfilliq-postgres
    environment:
      POSTGRES_USER: fulfilliq_user
      POSTGRES_PASSWORD: fulfilliq_password
      POSTGRES_DB: fulfilliq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfilliq_user -d fulfilliq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: fulfilliq-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://fulfilliq_user:fulfilliq_password@postgres:5432/fulfilliq_db
      - JWT_SECRET=super_secret_key_change_in_production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: fulfilliq-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
