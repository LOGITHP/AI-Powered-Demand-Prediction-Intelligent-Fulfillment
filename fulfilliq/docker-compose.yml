services:
  postgres:
    image: postgres:15-alpine
    container_name: fulfilliq-postgres
    environment:
      POSTGRES_USER: fulfilliq_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fulfilliq_dev_only}
      POSTGRES_DB: fulfilliq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfilliq_user -d fulfilliq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: fulfilliq-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fulfilliq_user:${POSTGRES_PASSWORD:-fulfilliq_dev_only}@postgres:5432/fulfilliq_db
      JWT_SECRET: ${JWT_SECRET:-fulfilliq-local-development-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MODEL_STORAGE_PATH: /app/ml_models
      SEED: ${SEED:-42}
      HISTORICAL_ORDER_COUNT: ${HISTORICAL_ORDER_COUNT:-30000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: fulfilliq-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
