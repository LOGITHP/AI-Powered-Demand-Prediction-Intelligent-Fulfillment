version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_password
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://warehouse_user:warehouse_password@postgres:5432/warehouse
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../warehouse_ml/models:/app/models # Mount models from ML project

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  manager-frontend:
    build:
      context: ./manager-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  operations-frontend:
    build:
      context: ./operations-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  pgdata:
