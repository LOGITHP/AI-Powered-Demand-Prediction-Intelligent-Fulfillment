version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_password
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/models:/app/models

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  manager-frontend:
    build:
      context: ./manager-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  inbound-frontend:
    build:
      context: ./inbound-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

  outbound-frontend:
    build:
      context: ./outbound-frontend
    ports:
      - "3002:80"
    depends_on:
      - backend

  operations-frontend:
    build:
      context: ./operations-frontend
    ports:
      - "3003:80"
    depends_on:
      - backend

  head-office:
    build:
      context: ./head_office_agent
    ports:
      - "8001:8000"

volumes:
  pgdata:
