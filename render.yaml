databases:
  - name: fulfilliq-db
    databaseName: fulfilliq
    user: fulfilliq
    plan: free
    region: singapore

services:
  - type: web
    name: fulfilliq
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./fulfilliq
    dockerfilePath: ./fulfilliq/Render.Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fulfilliq-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MODEL_STORAGE_PATH
        value: /tmp/fulfilliq-ml-models
      - key: HISTORICAL_ORDER_COUNT
        value: "30000"
